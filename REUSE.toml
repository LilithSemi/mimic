  ".envrc",
  ".gitignore",
  "LICENSE",
  "LICENSE-CERN-OHL-S",
  "README.md",
  "REUSE.toml",
  "devices.nix",
  "docs/**",
  "flake.lock",
  "flake.nix",
  "pkgs/**",
  "runtime/**",
  "ip/.envrc",
  "ip/.gitignore",
  "ip/CHANGELOG.md",
  "ip/README.md",
  "ip/analysis_options.yaml",
  "ip/bin/**",
  "ip/pubspec.lock",
  "ip/pubspec.lock.json",
  "ip/pubspec.yaml",
]
